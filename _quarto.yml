project:
  type: website
  resources:
    - files/
    - pics/
    - CNAME

website:
  title: "Yi Jia Liow"
  favicon: pics/favicon.ico
  site-url: "https://yijialiow.com"
  description: "Personal website of Yi Jia Liow."
  navbar:
    left:
      - href: research.qmd
        text: Research
      - href: teaching.qmd
        text: Teaching
      - href: ceramics.qmd
        text: Ceramics

format:
  html:
    theme: cosmo                    # try: flatly, litera, yeti, journal, lumen
    css: styles.css
    canonical-url: true             # emit <link rel="canonical"> so Google picks yijialiow.com
    toc: false
    page-layout: article
    fontsize: 1rem
    linestretch: 1.6
    link-external-newwindow: true
    mainfont: "Source Sans Pro, system-ui, sans-serif"
    include-after-body:
      text: |
        <script>
        document.querySelectorAll('a[href$=".pdf"]').forEach(a => {
          a.setAttribute('target', '_blank');
          a.setAttribute('rel', 'noopener');
        });
        const links = document.querySelector('.about-links');
        const contents = document.querySelector('.about-contents');
        if (links && contents) {
          const clone = links.cloneNode(true);
          clone.classList.add('about-links-mobile');
          contents.appendChild(clone);
        }
        </script>
