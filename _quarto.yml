project:
  type: website
  resources:
    - files/
    - pics/
    - CNAME

website:
  title: "Yi Jia Liow"
  favicon: pics/favicon.ico
  site-url: "https://yijialiow.com"
  description: "Personal website of Yi Jia Liow."
  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: research.qmd
        text: Research
      - href: teaching.qmd
        text: Teaching
      - href: ceramics.qmd
        text: Ceramics

format:
  html:
    theme: cosmo                    # try: flatly, litera, yeti, journal, lumen
    css: styles.css
    toc: false
    page-layout: article
    fontsize: 1rem
    linestretch: 1.6
    link-external-newwindow: true
    mainfont: "Source Sans Pro, system-ui, sans-serif"
    include-after-body:
      text: |
        <script>
        document.querySelectorAll('a[href$=".pdf"]').forEach(a => {
          a.setAttribute('target', '_blank');
          a.setAttribute('rel', 'noopener');
        });
        </script>
